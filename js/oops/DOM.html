<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Page</title>
    <style>
        body {
            background-color: #2c2c2c; /* Dark background */
            color: #f0f0f0; /* Light text color for contrast */
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #e0e0e0;
        }
        p {
            line-height: 1.5;
        }
        a {
            color: #87ceeb; /* Sky blue link color */
        }
        button {
            padding: 8px 15px;
            background-color: #555;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #777;
        }
    </style>
</head>
<body>

    <h1>Page Title</h1>

    <p>This is a paragraph of text. It demonstrates basic content structure on an HTML page with a dark background.</p>

    <ul>
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
    </ul>

    <a href="#">This is a sample link</a>

    <br><br>

    <button>Click Here</button>

</body>
</html>
